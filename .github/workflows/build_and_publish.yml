name: Build and Publish Floppa Store

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      create_github_release:
        description: 'Publish as a GitHub Release (attaches APKs)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # AGP 9.1.1 requires JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Download and install Gradle 9.3.1 CLI directly
      - name: Install Gradle 9.3.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          sudo unzip -q -d /opt/gradle gradle-9.3.1-bin.zip
          echo "/opt/gradle/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Prepare Keystores & Environment
        run: |
          # 1. Restore debug.keystore from base64
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
            echo "Created .env from .env.example"
          fi

          # 3. Restore release keystore if provided in GitHub Secrets
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "Restored release keystore from secrets.KEYSTORE_BASE64"
          fi

      - name: Verify Gradle Version & Environment
        run: |
          gradle --version
          java -version

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: |
          echo "Compiling Debug APK with Gradle 9.3.1 and Java 21..."
          gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "my-upload-key.jks" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "Compiling Signed Release APK..."
            gradle assembleRelease --no-daemon --stacktrace
          else
            echo "Release keystore secrets not provided. Falling back to assembleDebug."
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Organize Output Artifacts
        run: |
          mkdir -p build-artifacts

          # Copy any APK files found in output directory
          find app/build/outputs/apk/ -name "*.apk" -type f | while read -r apk; do
            echo "Found APK: $apk"
            cp "$apk" build-artifacts/
          done

          # Standardize naming for primary download
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "build-artifacts/floppa-store-debug.apk"
            echo "Standardized floppa-store-debug.apk"
          fi
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "build-artifacts/floppa-store-release.apk"
            echo "Standardized floppa-store-release.apk"
          fi

          # Generate SHA-256 Checksums for FloppaSecurity & VirusTotal verification
          cd build-artifacts
          sha256sum *.apk > sha256_checksums.txt
          echo "Generated SHA-256 Checksums:"
          cat sha256_checksums.txt
          cd ..

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floppa-store-apks
          path: build-artifacts/
          retention-days: 30

      # Publish directly to GitHub Releases on EVERY successful build
      - name: Publish to GitHub Releases
        if: ${{ success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0-build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Floppa Store {0}', github.ref_name) || format('Floppa Store v1.0 (Build #{0})', github.run_number) }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            build-artifacts/*.apk
            build-artifacts/sha256_checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
