name: Build and Publish Floppa Store

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # AGP 9.1.1 requires JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystores & Environment
        run: |
          # 1. Restore debug.keystore from base64
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
            echo "Restored debug.keystore from debug.keystore.base64"
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

          # 2. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
            echo "Created .env from .env.example"
          fi

          # 3. Restore release keystore if provided in GitHub Secrets
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks || true
            echo "Restored release keystore from secrets.KEYSTORE_BASE64"
          fi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8"
        run: |
          echo "Compiling Debug APK with Gradle 9.3.1 and Java 21..."
          gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8"
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "my-upload-key.jks" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "Compiling Signed Release APK..."
            gradle assembleRelease --no-daemon --stacktrace
          else
            echo "Release keystore secrets not provided. Falling back to assembleDebug."
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Organize Output Artifacts
        run: |
          mkdir -p build-artifacts

          # Copy all generated APKs
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp -v {} build-artifacts/ \;

          # Ensure standardized names
          if [ -f "build-artifacts/app-debug.apk" ] && [ ! -f "build-artifacts/floppa-store-debug.apk" ]; then
            cp -v "build-artifacts/app-debug.apk" "build-artifacts/floppa-store-debug.apk"
          fi
          if [ -f "build-artifacts/app-release.apk" ] && [ ! -f "build-artifacts/floppa-store-release.apk" ]; then
            cp -v "build-artifacts/app-release.apk" "build-artifacts/floppa-store-release.apk"
          fi

          # Generate SHA-256 Checksums for verification
          cd build-artifacts
          sha256sum *.apk > sha256_checksums.txt || true
          echo "Generated SHA-256 Checksums:"
          cat sha256_checksums.txt || true
          cd ..

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floppa-store-apks
          path: build-artifacts/
          retention-days: 30

      # Publish directly to GitHub Releases using GitHub CLI
      - name: Publish to GitHub Releases
        if: ${{ success() }}
        continue-on-error: true
        id: publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0-build-{0}', github.run_number) }}"
          RELEASE_TITLE="${{ startsWith(github.ref, 'refs/tags/v') && format('Floppa Store {0}', github.ref_name) || format('Floppa Store v1.0 (Build #{0})', github.run_number) }}"
          echo "Publishing release: $TAG_NAME ($RELEASE_TITLE)..."

          # Use official GitHub CLI pre-installed on the runner
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" build-artifacts/*.apk build-artifacts/sha256_checksums.txt --clobber || true
          else
            gh release create "$TAG_NAME" build-artifacts/*.apk build-artifacts/sha256_checksums.txt \
              --title "$RELEASE_TITLE" \
              --notes "Automated release build of Floppa Store." \
              --latest || true
          fi

      - name: Release Status Notification
        if: steps.publish_release.outcome == 'failure'
        run: |
          echo "::notice::APK was compiled successfully and uploaded to Artifacts ('floppa-store-apks')."
          echo "::notice::To enable automated GitHub Releases publishing, enable 'Read and write permissions' in repository Settings -> Actions -> General -> Workflow permissions."
