name: Build and Publish Floppa Store

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      create_github_release:
        description: 'Publish as a GitHub Release (attaches APKs)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Setup Keystores
        run: |
          # 1. Restore debug.keystore from base64 if present
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          fi

          # 2. Restore release keystore if provided in GitHub Secrets
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "Restored release keystore from secrets.KEYSTORE_BASE64"
          fi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: |
          echo "Compiling Debug APK..."
          gradle assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "my-upload-key.jks" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "Compiling Signed Release APK..."
            gradle assembleRelease --stacktrace
          else
            echo "Release keystore secrets not provided. Falling back to assembleDebug."
            gradle assembleDebug --stacktrace
          fi

      - name: Organize Output Artifacts
        run: |
          mkdir -p build-artifacts

          # Copy Debug APK if generated
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/floppa-store-debug.apk
            echo "Copied floppa-store-debug.apk"
          fi

          # Copy Release APK if generated
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/floppa-store-release.apk
            echo "Copied floppa-store-release.apk"
          fi

          # Generate SHA-256 Checksum for FloppaSecurity & VirusTotal verification
          cd build-artifacts
          sha256sum *.apk > sha256_checksums.txt
          cat sha256_checksums.txt
          cd ..

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floppa-store-apks
          path: build-artifacts/
          retention-days: 30

      - name: Publish to GitHub Releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_github_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          name: Floppa Store ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build-artifacts/*.apk
            build-artifacts/sha256_checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
